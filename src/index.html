<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opiskelijaravintolat</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Fraunces:wght@600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      defer
    ></script>
    <script type="module" src="js/main.js"></script>
  </head>

  <body>
    <header id="app-header">
      <h1>Opiskelijaravintolat</h1>
      <button type="button" id="user-button">Kirjaudu</button>
    </header>

    <main>
      <div id="filters">
        <div class="filter-group">
          <label for="city-filter">Kaupunki</label>
          <select id="city-filter">
            <option value="">Kaikki</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="provider-filter">Palveluntarjoaja</label>
          <select id="provider-filter">
            <option value="">Kaikki</option>
          </select>
        </div>

        <button type="button" id="nearest-button">Näytä lähin</button>
      </div>

      <div class="view-toggle">
        <button type="button" class="active" id="list-button">Lista</button>
        <button type="button" id="map-button">Kartta</button>
      </div>

      <div id="restaurants">
        <ul id="restaurant-list"></ul>
      </div>

      <div id="map" class="hidden">
        <div id="map-container"></div>
      </div>
    </main>

    <dialog id="menu-dialog">
      <div class="dialog-content">
        <div class="dialog-header">
          <h2>Ravintola</h2>
          <form method="dialog">
            <button type="submit" aria-label="Sulje">✕</button>
          </form>
        </div>
        <p class="restaurant-info">Osoite</p>
        <div class="view-toggle">
          <button type="button" class="active" id="daily-button">Päivä</button>
          <button type="button" id="weekly-button">Viikko</button>
        </div>
        <ul id="menu-list"></ul>
      </div>
    </dialog>

    <dialog id="user-dialog">
      <div class="dialog-content">
        <div class="dialog-header">
          <h2 id="user-dialog-title">Kirjaudu</h2>
          <form method="dialog">
            <button type="submit" aria-label="Sulje">✕</button>
          </form>
        </div>

        <form id="login-form" class="auth-form">
          <label for="login-username">Käyttäjänimi</label>
          <input type="text" id="login-username" required />
          <label for="login-password">Salasana</label>
          <input type="password" id="login-password" required />
          <p class="form-error" id="login-error"></p>
          <button type="submit" class="primary-button">Kirjaudu</button>
          <button type="button" class="link-button" id="show-register">
            Ei tiliä? Rekisteröidy
          </button>
        </form>

        <form id="register-form" class="auth-form hidden">
          <label for="register-username">Käyttäjänimi</label>
          <input type="text" id="register-username" required />
          <label for="register-email">Sähköposti</label>
          <input type="email" id="register-email" required />
          <label for="register-password">Salasana</label>
          <input type="password" id="register-password" required />
          <label for="register-password2">Salasana uudelleen</label>
          <input type="password" id="register-password2" required />
          <p class="form-error" id="register-error"></p>
          <button type="submit" class="primary-button">Rekisteröidy</button>
          <button type="button" class="link-button" id="show-login">
            Onko sinulla tili? Kirjaudu
          </button>
        </form>

        <div id="logged-in" class="auth-form hidden">
          <p id="logged-in-text"></p>
          <button type="button" class="primary-button" id="logout-button">
            Kirjaudu ulos
          </button>
        </div>
      </div>
    </dialog>
  </body>
</html>
